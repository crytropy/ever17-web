<!doctype html>
<html lang="{{GAME_LANG}}">
<head>
<meta charset="utf-8">
<title>{{GAME_TITLE}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="{{THEME_COLOR}}">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html, body { margin:0; height:100%; background:#000; color:#fff;
               font-family:"Songti SC","SimSun","Noto Serif CJK SC",serif;
               touch-action:manipulation; -webkit-user-select:none; user-select:none;
               padding:env(safe-area-inset-top) env(safe-area-inset-right)
                       env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; width:{{STAGE_W}}px; height:{{STAGE_H}}px; flex:none; overflow:hidden; background:#000;
           transform-origin:center; }
  #pixi-parent, #movie { position:absolute; inset:0; }
  #pixi-parent canvas { display:block; }
  #movie { inset:0; width:100%; height:100%; background:#000; object-fit:contain; }
  #textbox {
    position:absolute; left:20px; right:20px; bottom:16px; min-height:110px;
    background:rgba(0,0,20,.72); border:1px solid rgba(160,190,255,.5); border-radius:6px;
    padding:10px 16px; box-sizing:border-box; cursor:pointer;
  }
  #speaker { color:#9fc3ff; font-size:18px; min-height:22px; }
  #text { font-size:20px; line-height:1.5; white-space:pre-wrap; }
  #more { position:absolute; right:14px; bottom:8px; color:#9fc3ff; animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:0 } }
  #choices { position:absolute; inset:0; display:flex; flex-direction:column; gap:14px;
             align-items:center; justify-content:center; background:rgba(0,0,0,.35); }
  #choices button {
    min-width:340px; padding:10px 24px; font-size:20px; font-family:inherit;
    background:rgba(10,20,60,.88); color:#fff; border:1px solid #9fc3ff; border-radius:6px; cursor:pointer;
  }
  #choices button:hover { background:rgba(60,90,160,.9); }
  #title { position:absolute; inset:0; display:flex; flex-direction:column; gap:18px;
           align-items:center; justify-content:center; background:#000; z-index:10; cursor:pointer; }
  #title h1 { font-size:42px; letter-spacing:.3em; margin:0; color:#cfe0ff; }
  #title p { color:#8899bb; margin:0; }
  #title-menu { display:flex; flex-direction:column; gap:10px; margin:10px 0 4px; }
  #title-menu button {
    min-width:240px; padding:9px 22px; font:15px/1 inherit; letter-spacing:.18em;
    background:rgba(10,20,60,.88); color:#cfe0ff; border:1px solid #9fc3ff; border-radius:5px;
    cursor:pointer;
  }
  #title-menu button:hover { background:rgba(60,90,160,.9); color:#fff; }
  #title-menu button[disabled] { opacity:.35; cursor:default; border-color:#445; }
  #loading {
    position:absolute; left:50%; bottom:150px; transform:translateX(-50%); z-index:12;
    display:flex; align-items:center; gap:9px; padding:7px 16px; border-radius:5px;
    background:rgba(0,10,30,.82); border:1px solid rgba(160,190,255,.35);
    color:#9fc3ff; font:13px monospace; pointer-events:none;
  }
  #loading .spinner {
    width:11px; height:11px; border:2px solid rgba(159,195,255,.3); border-top-color:#9fc3ff;
    border-radius:50%; animation:spin .8s linear infinite; display:inline-block;
  }
  @keyframes spin { to { transform:rotate(360deg) } }
  #error {
    /* below the control row so it never covers the buttons */
    position:fixed; left:50%; top:44px; transform:translateX(-50%); z-index:40; max-width:92vw;
    background:rgba(60,14,14,.95); border:1px solid #d98a8a; border-radius:6px;
    color:#ffdede; padding:10px 16px; font:13px/1.5 monospace;
    display:flex; align-items:center; gap:14px;
  }
  #error button {
    font:12px monospace; padding:4px 12px; background:rgba(20,30,60,.85);
    color:#ffdede; border:1px solid #d98a8a; border-radius:4px; cursor:pointer; flex:none;
  }
  #error-text { white-space:pre-wrap; }
  #hud { position:fixed; left:8px; top:6px; font-size:12px; color:#667; font-family:monospace; }
  #controls { position:fixed; right:8px; top:6px; display:flex; flex-wrap:wrap;
              justify-content:flex-end; gap:6px; z-index:20; max-width:60vw; }
  #controls button {
    font:12px monospace; padding:3px 10px; background:rgba(20,30,60,.85); color:#9fc3ff;
    border:1px solid #445; border-radius:4px; cursor:pointer;
  }
  #controls button.on { background:#3a5aa0; color:#fff; border-color:#9fc3ff; }
  #backlog {
    position:absolute; inset:0; background:rgba(0,0,10,.92); z-index:15;
    overflow-y:auto; padding:24px 40px; box-sizing:border-box;
  }
  #backlog .entry { margin-bottom:14px; }
  #backlog .who { color:#9fc3ff; font-size:15px; }
  #backlog .line { font-size:17px; line-height:1.45; white-space:pre-wrap; }
  #backlog .scn { color:#556; font-size:11px; font-family:monospace; }
  #confirm-text { color:#cfe0ff; font-size:14px; line-height:1.6; white-space:pre-wrap; }
  .confirm-actions { display:flex; gap:10px; margin-top:16px; }
  .confirm-actions button {
    font:13px monospace; padding:6px 18px; background:rgba(20,30,60,.85);
    color:#9fc3ff; border:1px solid #445; border-radius:4px; cursor:pointer;
  }
  .confirm-actions button:hover { border-color:#9fc3ff; }
  #menu, #settings, #confirm {
    position:fixed; inset:0; z-index:25; background:rgba(0,0,10,.8);
    display:flex; align-items:center; justify-content:center;
  }
  #menu-box {
    background:#0d1428; border:1px solid #445; border-radius:8px; padding:18px 22px;
    max-width:640px; width:92vw; max-height:84vh; overflow-y:auto;
  }
  #menu-title { color:#9fc3ff; font-size:18px; letter-spacing:.2em; margin-bottom:12px; }
  #menu-slots { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:10px; }
  .slot {
    background:rgba(30,40,80,.6); border:1px solid #334; border-radius:6px; padding:8px;
    cursor:pointer; font-size:12px; color:#cfe0ff; text-align:left;
  }
  .slot:hover { border-color:#9fc3ff; }
  .slot img { width:100%; border-radius:3px; display:block; margin-bottom:6px; background:#000; }
  .slot .empty-thumb { width:100%; aspect-ratio:4/3; background:#0a0f20; border-radius:3px;
    display:flex; align-items:center; justify-content:center; color:#456; margin-bottom:6px; }
  .slot .when { color:#68a; font-size:10px; }
  #menu-close, #settings-close {
    margin-top:14px; font:13px monospace; padding:5px 16px; background:rgba(20,30,60,.85);
    color:#9fc3ff; border:1px solid #445; border-radius:4px; cursor:pointer;
  }
  .cfg-row { display:flex; align-items:center; gap:12px; margin:10px 0; font-size:14px; }
  .cfg-row label { width:130px; color:#9fc3ff; }
  .cfg-row input[type=range] { flex:1; }
  .cfg-row span { width:44px; text-align:right; font-family:monospace; }
  #toast {
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:rgba(20,40,80,.95); color:#cfe0ff; padding:6px 18px; border-radius:5px;
    font-size:14px; z-index:30; transition:opacity .4s; opacity:0; pointer-events:none;
  }
  .hidden { display:none !important; }
  /* phone-sized viewports: the stage letterboxes, so shrink the fixed chrome */
  @media (max-width: 700px) {
    #controls { gap:4px; max-width:100vw; left:4px; right:4px; justify-content:center; }
    #controls button { padding:3px 7px; font-size:11px; }
    #hud { font-size:10px; opacity:.7; }
    #title h1 { font-size:30px; }
    #title-menu button { min-width:200px; padding:11px 18px; }
    #loading { bottom:120px; font-size:12px; }
    /* the control row wraps on narrow viewports; keep clear of two rows */
    #error { top:62px; font-size:12px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div id="pixi-parent"></div>
    <video id="movie" class="hidden" playsinline></video>
    <div id="textbox"><div id="speaker"></div><div id="text"></div><div id="more">▼</div></div>
    <div id="choices" class="hidden"></div>
    <div id="backlog" class="hidden"></div>
    <div id="title">
      <h1>{{GAME_TITLE}}</h1>
      <p>{{GAME_SUBTITLE}}</p>
      <div id="title-menu">
        <button id="t-new">NEW GAME</button>
        <button id="t-continue" class="hidden">CONTINUE</button>
        <button id="t-load">LOAD</button>
        <button id="t-settings">SETTINGS</button>
        <button id="t-routes">ROUTES</button>
      </div>
      <p id="titlehint">{{GAME_HINT}}</p>
    </div>
    <div id="loading" class="hidden"><span class="spinner"></span><span id="loading-text">converting artwork…</span></div>
  </div>
</div>
<div id="hud"></div>
<div id="controls">
  <button id="btn-auto" title="auto-advance (A)">AUTO</button>
  <button id="btn-skip" title="fast-forward (Ctrl)">SKIP</button>
  <button id="btn-log" title="backlog (L)">LOG</button>
  <button id="btn-save" title="save menu (S)">SAVE</button>
  <button id="btn-load" title="load menu (D)">LOAD</button>
  <button id="btn-quick" title="quicksave (Q)">QS</button>
  <button id="btn-routes" title="route explorer (R)">✦</button>
  <button id="btn-cfg" title="settings (O)">⚙</button>
  <button id="btn-title" title="return to title (T)">TITLE</button>
</div>
<div id="confirm" class="hidden">
  <div id="menu-box">
    <div id="menu-title">CONFIRM</div>
    <div id="confirm-text"></div>
    <div class="confirm-actions">
      <button id="confirm-ok">OK</button>
      <button id="confirm-cancel">cancel</button>
    </div>
  </div>
</div>
<div id="error" class="hidden"><span id="error-text"></span><button id="error-retry">retry</button><button id="error-close">dismiss</button></div>
<div id="menu" class="hidden">
  <div id="menu-box">
    <div id="menu-title">SAVE</div>
    <div id="menu-slots"></div>
    <button id="menu-close">close</button>
  </div>
</div>
<div id="settings" class="hidden">
  <div id="menu-box">
    <div id="menu-title">SETTINGS</div>
    <div class="cfg-row"><label>BGM volume</label><input id="cfg-bgm" type="range" min="0" max="1" step="0.05"><span></span></div>
    <div class="cfg-row"><label>SE volume</label><input id="cfg-se" type="range" min="0" max="1" step="0.05"><span></span></div>
    <div class="cfg-row"><label>Voice volume</label><input id="cfg-voice" type="range" min="0" max="1" step="0.05"><span></span></div>
    <div class="cfg-row"><label>Auto delay</label><input id="cfg-auto" type="range" min="0.25" max="4" step="0.25"><span></span></div>
    <div class="cfg-row"><label>Transition speed</label><input id="cfg-trans" type="range" min="0" max="4" step="0.25"><span></span></div>
    <button id="settings-close">close</button>
  </div>
</div>
<div id="toast"></div>
<script src="bundle.js"></script>
</body>
</html>
