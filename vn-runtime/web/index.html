<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Ever17 vn-runtime</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin:0; height:100%; background:#000; color:#fff;
               font-family:"Songti SC","SimSun","Noto Serif CJK SC",serif; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; width:800px; height:600px; overflow:hidden; background:#000;
           transform-origin:center; }
  #pixi-parent, #movie { position:absolute; inset:0; }
  #pixi-parent canvas { display:block; }
  #movie { inset:0; width:100%; height:100%; background:#000; object-fit:contain; }
  #textbox {
    position:absolute; left:20px; right:20px; bottom:16px; min-height:110px;
    background:rgba(0,0,20,.72); border:1px solid rgba(160,190,255,.5); border-radius:6px;
    padding:10px 16px; box-sizing:border-box; cursor:pointer;
  }
  #speaker { color:#9fc3ff; font-size:18px; min-height:22px; }
  #text { font-size:20px; line-height:1.5; white-space:pre-wrap; }
  #more { position:absolute; right:14px; bottom:8px; color:#9fc3ff; animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:0 } }
  #choices { position:absolute; inset:0; display:flex; flex-direction:column; gap:14px;
             align-items:center; justify-content:center; background:rgba(0,0,0,.35); }
  #choices button {
    min-width:340px; padding:10px 24px; font-size:20px; font-family:inherit;
    background:rgba(10,20,60,.88); color:#fff; border:1px solid #9fc3ff; border-radius:6px; cursor:pointer;
  }
  #choices button:hover { background:rgba(60,90,160,.9); }
  #title { position:absolute; inset:0; display:flex; flex-direction:column; gap:18px;
           align-items:center; justify-content:center; background:#000; z-index:10; cursor:pointer; }
  #title h1 { font-size:42px; letter-spacing:.3em; margin:0; color:#cfe0ff; }
  #title p { color:#8899bb; }
  #hud { position:fixed; left:8px; top:6px; font-size:12px; color:#667; font-family:monospace; }
  #controls { position:fixed; right:8px; top:6px; display:flex; gap:6px; z-index:20; }
  #controls button {
    font:12px monospace; padding:3px 10px; background:rgba(20,30,60,.85); color:#9fc3ff;
    border:1px solid #445; border-radius:4px; cursor:pointer;
  }
  #controls button.on { background:#3a5aa0; color:#fff; border-color:#9fc3ff; }
  #backlog {
    position:absolute; inset:0; background:rgba(0,0,10,.92); z-index:15;
    overflow-y:auto; padding:24px 40px; box-sizing:border-box;
  }
  #backlog .entry { margin-bottom:14px; }
  #backlog .who { color:#9fc3ff; font-size:15px; }
  #backlog .line { font-size:17px; line-height:1.45; white-space:pre-wrap; }
  #backlog .scn { color:#556; font-size:11px; font-family:monospace; }
  #toast {
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:rgba(20,40,80,.95); color:#cfe0ff; padding:6px 18px; border-radius:5px;
    font-size:14px; z-index:30; transition:opacity .4s; opacity:0; pointer-events:none;
  }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div id="pixi-parent"></div>
    <video id="movie" class="hidden" playsinline></video>
    <div id="textbox"><div id="speaker"></div><div id="text"></div><div id="more">▼</div></div>
    <div id="choices" class="hidden"></div>
    <div id="backlog" class="hidden"></div>
    <div id="title"><h1>Ever17</h1><p>-the out of infinity-</p><p id="titlehint">click to start · 点击开始</p></div>
  </div>
</div>
<div id="hud"></div>
<div id="controls">
  <button id="btn-auto" title="auto-advance (A)">AUTO</button>
  <button id="btn-skip" title="fast-forward (Ctrl)">SKIP</button>
  <button id="btn-log" title="backlog (L)">LOG</button>
  <button id="btn-save" title="save">SAVE</button>
  <button id="btn-load" title="load">LOAD</button>
</div>
<div id="toast"></div>
<script src="bundle.js"></script>
</body>
</html>
